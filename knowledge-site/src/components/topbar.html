<div class="topbar panel">
  <div class="topbar-left">
    <button type="button" class="ghost-button icon-button" id="left-panel-toggle" aria-label="Toggle navigation" title="Toggle navigation">
      &#9776;
    </button>
  </div>
  <div class="topbar-center">
    <div class="brand-block">
      <a href="./" class="brand-title" data-home-link>Aether Atlas</a>
    </div>
    <div class="topbar-search">
      <label class="search-shell" for="site-search">
        <span class="search-icon" aria-hidden="true">&#8981;</span>
        <input
          id="site-search"
          type="search"
          placeholder="Search notes, tags, and ideas"
          autocomplete="off"
        />
      </label>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>
  <div class="topbar-right">
    <button type="button" class="ghost-button icon-button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
      &#9790;
    </button>
    <button type="button" class="ghost-button icon-button" id="right-panel-toggle" aria-label="Toggle context panel" title="Toggle context panel">
      &#9707;
    </button>
  </div>
</div>
