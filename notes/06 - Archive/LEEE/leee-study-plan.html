
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);color:var(--color-text-primary, #1a1a1a);font-size:14px;background:var(--color-background-primary, #ffffff)}
.header{padding:1rem 0 .75rem;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:1rem}
.header h2{font-size:18px;font-weight:500;margin-bottom:.4rem}
.progress-bar-wrap{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden;margin:.5rem 0}
.progress-bar{height:100%;background:#1D9E75;border-radius:3px;transition:width .4s}
.stats{display:flex;gap:1rem;font-size:12px;color:var(--color-text-secondary)}
.stat-val{font-weight:500;color:var(--color-text-primary)}
.day-card{border:.5px solid var(--color-border-tertiary);border-radius:8px;margin-bottom:.75rem;overflow:hidden}
.day-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;cursor:pointer;user-select:none;background:var(--color-background-secondary)}
.day-header:hover{background:var(--color-background-tertiary)}
.day-left{display:flex;align-items:center;gap:.6rem}
.day-date{font-weight:500;font-size:13px}
.day-title{font-size:13px;color:var(--color-text-secondary)}
.day-right{display:flex;align-items:center;gap:.6rem}
.day-mini-progress{font-size:11px;color:var(--color-text-tertiary)}
.day-complete-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--color-background-success);color:var(--color-text-success);border:.5px solid var(--color-border-success)}
.day-partial-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--color-background-warning);color:var(--color-text-warning);border:.5px solid var(--color-border-warning)}
.chevron{font-size:12px;color:var(--color-text-tertiary);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.day-body{padding:.75rem .9rem;border-top:.5px solid var(--color-border-tertiary)}
.task-row{display:flex;align-items:flex-start;gap:.6rem;padding:.35rem 0;border-bottom:.5px solid var(--color-border-tertiary);cursor:pointer}
.task-row:last-child{border-bottom:none}
.task-row:hover .task-label{color:var(--color-text-primary)}
.checkbox{width:16px;height:16px;border:1.5px solid var(--color-border-secondary, #888);border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--color-background-primary, #ffffff)}
.checkbox.checked{background:#1D9E75;border-color:#1D9E75}
.check-icon{color:white;font-size:11px;font-weight:500;line-height:1}
.task-content{flex:1}
.task-label{font-size:13px;color:var(--color-text-secondary);line-height:1.5;transition:color .15s}
.task-label.done{text-decoration:line-through;color:var(--color-text-tertiary)}
.task-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:.25rem}
.tag{font-size:10px;padding:1px 6px;border-radius:3px;border:.5px solid}
.t-new{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.t-rev{background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-border-success)}
.t-apt{background:var(--color-background-warning);color:var(--color-text-warning);border-color:var(--color-border-warning)}
.t-pyq{background:var(--color-background-secondary);color:var(--color-text-secondary);border-color:var(--color-border-tertiary)}
.t-exam{background:#FAECE7;color:#993C1D;border-color:#F0997B}
.t-mock{background:#EEEDFE;color:#534AB7;border-color:#AFA9EC}
.phase-label{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-tertiary);padding:.5rem 0 .3rem;margin-top:.5rem}
.today-indicator{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--color-background-info);color:var(--color-text-info);border:.5px solid var(--color-border-info)}
.reset-btn{font-size:12px;padding:4px 10px;border-radius:4px;border:.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.reset-btn:hover{background:var(--color-background-secondary)}
</style>

const TAG_CLASS = {new:"t-new",rev:"t-rev",apt:"t-apt",pyq:"t-pyq",exam:"t-exam",mock:"t-mock"};
const TAG_LABEL = {new:"New topic",rev:"Revision",apt:"Aptitude",pyq:"PYQs",exam:"Exam",mock:"Mock test"};

let checked = {};
let open = {};
const TODAY = "Apr 18";

async function loadState(){
  try{
    const r = await window.storage.get("leee-tracker-v2");
    if(r && r.value){const s=JSON.parse(r.value);checked=s.checked||{};open=s.open||{};}
  }catch(e){checked={};open={};}
}

async function saveState(){
  try{await window.storage.set("leee-tracker-v2",JSON.stringify({checked,open}));}catch(e){}
}

function getAllTaskIds(){
  const ids=[];
  PLAN.forEach(p=>p.days.forEach(d=>d.tasks.forEach(t=>ids.push(t.id))));
  return ids;
}

function updateStats(){
  const all=getAllTaskIds();
  const done=all.filter(id=>checked[id]).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  document.getElementById("done-count").textContent=done;
  document.getElementById("total-count").textContent=all.length;
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("main-bar").style.width=pct+"%";
}

function getDayProgress(day){
  const total=day.tasks.length;
  const done=day.tasks.filter(t=>checked[t.id]).length;
  return{done,total};
}

function toggleTask(tid,dayId){
  checked[tid]=!checked[tid];
  saveState();
  const el=document.getElementById("cb-"+tid);
  const lbl=document.getElementById("lbl-"+tid);
  if(el){el.className="checkbox"+(checked[tid]?" checked":"");el.innerHTML=checked[tid]?'<span class="check-icon">✓</span>':"";}
  if(lbl){lbl.className="task-label"+(checked[tid]?" done":"");}
  updateDayBadge(dayId);
  updateStats();
}

function updateDayBadge(dayId){
  const day=PLAN.flatMap(p=>p.days).find(d=>d.id===dayId);
  if(!day)return;
  const {done,total}=getDayProgress(day);
  const badge=document.getElementById("badge-"+dayId);
  const mini=document.getElementById("mini-"+dayId);
  if(mini)mini.textContent=done+"/"+total;
  if(badge){
    if(done===total){badge.className="day-complete-badge";badge.textContent="Complete";}
    else if(done>0){badge.className="day-partial-badge";badge.textContent=done+"/"+total+" done";}
    else{badge.className="";badge.textContent="";}
  }
}

function toggleDay(dayId){
  open[dayId]=!open[dayId];
  saveState();
  const body=document.getElementById("body-"+dayId);
  const chev=document.getElementById("chev-"+dayId);
  if(body){body.style.display=open[dayId]?"block":"none";}
  if(chev){chev.className="chevron"+(open[dayId]?" open":"");}
}

async function resetAll(){
  if(!confirm("Reset all progress?"))return;
  checked={};open={};
  await saveState();
  render();
}

function render(){
  const container=document.getElementById("plan-container");
  container.innerHTML="";

  PLAN.forEach(phase=>{
    const pDiv=document.createElement("div");
    pDiv.style.cssText="margin-bottom:1.5rem;border-left:3px solid "+phase.phaseColor+";padding-left:1rem";
    const ph=document.createElement("div");
    ph.className="phase-label";
    ph.textContent=phase.phase;
    pDiv.appendChild(ph);

    phase.days.forEach(day=>{
      const isOpen=open[day.id]!==undefined?open[day.id]:(day.date===TODAY);
      if(open[day.id]===undefined)open[day.id]=isOpen;

      const {done,total}=getDayProgress(day);
      const isComplete=done===total;
      const isPartial=done>0&&!isComplete;
      const isToday=day.date===TODAY;

      const card=document.createElement("div");
      card.className="day-card";
      card.style.borderColor=isComplete?"var(--color-border-success)":"var(--color-border-tertiary)";

      card.innerHTML=`
        <div class="day-header" onclick="toggleDay('${day.id}')">
          <div class="day-left">
            <span class="day-date">${day.date}</span>
            ${isToday?'<span class="today-indicator">today</span>':""}
            <span class="day-title">${day.label}</span>
          </div>
          <div class="day-right">
            <span class="day-mini-progress" id="mini-${day.id}">${done}/${total}</span>
            <span id="badge-${day.id}" class="${isComplete?"day-complete-badge":isPartial?"day-partial-badge":""}">${isComplete?"Complete":isPartial?done+"/"+total+" done":""}</span>
            <span class="chevron${isOpen?" open":""}" id="chev-${day.id}">▾</span>
          </div>
        </div>
        <div class="day-body" id="body-${day.id}" style="display:${isOpen?"block":"none"}">
          ${day.tasks.map(task=>`
            <div class="task-row" onclick="toggleTask('${task.id}','${day.id}')">
              <div class="checkbox${checked[task.id]?" checked":""}" id="cb-${task.id}">${checked[task.id]?'<span class="check-icon">✓</span>':""}</div>
              <div class="task-content">
                <div class="task-label${checked[task.id]?" done":""}" id="lbl-${task.id}">${task.label}</div>
                <div class="task-tags">${task.tags.map(tg=>`<span class="tag ${TAG_CLASS[tg]}">${TAG_LABEL[tg]}</span>`).join("")}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
      pDiv.appendChild(card);
    });
    container.appendChild(pDiv);
  });

  updateStats();
}

loadState().then(render);
</script>
